  <header class="wrap site-header">
    <a href="{{ '/' | relative_url }}" class="site-name">{{ site.title }}</a>
    <div class="header-right">
      <div class="header-links">
        {% if site.email %}<a href="mailto:{{ site.email }}">Email</a>{% endif %}
        {% if site.scholar %}<a href="{{ site.scholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a>{% endif %}
        {% if site.linkedin %}<a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>{% endif %}
        {% if site.orcid %}<a href="{{ site.orcid }}" target="_blank" rel="noopener noreferrer">ORCID</a>{% endif %}
        {% if site.researchgate %}<a href="{{ site.researchgate }}" target="_blank" rel="noopener noreferrer">ResearchGate</a>{% endif %}
        {% if site.bluesky %}<a href="{{ site.bluesky }}" target="_blank" rel="noopener noreferrer">Bluesky</a>{% endif %}
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
        <a href="{{ '/cv' | relative_url }}"{% if page.url contains 'cv' and page.url != '/vitae/' %} class="active"{% endif %}>CV</a>
        <a href="{{ '/research' | relative_url }}"{% if page.url contains 'research' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/courses' | relative_url }}"{% if page.url contains 'courses' %} class="active"{% endif %}>Teaching</a>
        <a href="{{ '/data' | relative_url }}"{% if page.url contains 'data' %} class="active"{% endif %}>Data</a>
      </nav>
    </div>
  </header>
