<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.png?v=2' | relative_url }}" type="image/png">
  <link rel="icon" href="{{ '/favicon.svg?v=2' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png?v=2' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "email": "{{ site.email }}",
    "jobTitle": "Doctoral candidate and Fulbright fellow",
    "affiliation": {
      "@type": "Organization",
      "name": "Texas Tech University",
      "department": "College of Media & Communication"
    },
    "sameAs": [{% assign _p = "" | split: "" %}{% if site.scholar %}{% assign _p = _p | push: site.scholar %}{% endif %}{% if site.orcid %}{% assign _p = _p | push: site.orcid %}{% endif %}{% if site.linkedin %}{% assign _p = _p | push: site.linkedin %}{% endif %}{% if site.researchgate %}{% assign _p = _p | push: site.researchgate %}{% endif %}{% if site.bluesky %}{% assign _p = _p | push: site.bluesky %}{% endif %}{% for u in _p %}"{{ u }}"{% unless forloop.last %},{% endunless %}{% endfor %}]
  }
  </script>
</head>

<body>

{% include header.html %}

  <main class="wrap site-main">
    <h1 class="page-title">{{ page.title }}</h1>
    {{ content }}
  </main>

{% include footer.html %}

</body>
</html>
